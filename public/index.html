<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biar FCA Troll Bot Control Panel</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 650px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
    h2 { color: #00d2ff; text-align: center; margin-top: 0; }
    label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: #bbb; }
    input[type="text"], textarea { width: 100%; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 5px; padding: 10px; box-sizing: border-box; font-size: 14px; }
    textarea { height: 100px; resize: vertical; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
    .btn-start { background: #28a745; color: white; }
    .btn-start:hover { background: #218838; }
    .btn-stop { background: #dc3545; color: white; }
    .btn-stop:hover { background: #c82333; }
    .status-card { background: #2a2a2a; padding: 15px; border-radius: 5px; margin-bottom: 20px; border-left: 5px solid #ffc107; }
    .status-card.active { border-left-color: #28a745; }
  </style>
</head>
<body>

<div class="container">
  <h2>FB Troll Bot Dashboard</h2>

  <div id="statusCard" class="status-card">
    <strong>Status:</strong> <span id="botStatus">Offline</span><br>
    <strong>Uptime:</strong> <span id="botUptime">0 seconds</span><br>
    <strong>Active Admin ID:</strong> <span id="activeAdmin">None</span>
  </div>

  <label for="adminId">Admin Facebook ID (UID):</label>
  <input type="text" id="adminId" placeholder="Halimbawa: 10001234567890">

  <label for="appstate">C3C / AppState JSON Data:</label>
  <textarea id="appstate" placeholder='Paste your C3C appstate JSON format here...'></textarea>

  <label for="replies">Custom Replies / Troll Words (Isang linya bawat reply):</label>
  <textarea id="replies" placeholder="āšō ķā&#10;ïyāķ ķā&#10;žāľā mō"></textarea>

  <label for="suffixes">Custom Suffixes (Isang linya bawat suffix):</label>
  <textarea id="suffixes" placeholder="[Bot-V1]&#10;~ Auto Reply&#10;⚡ Troll Mode"></textarea>

  <div class="btn-group">
    <button class="btn-start" onclick="startBot()">Start Bot</button>
    <button class="btn-stop" onclick="stopBot()">Stop Bot</button>
  </div>
</div>

<script>
  async function checkStatus() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      
      const statusText = document.getElementById('botStatus');
      const uptimeText = document.getElementById('botUptime');
      const activeAdmin = document.getElementById('activeAdmin');
      const statusCard = document.getElementById('statusCard');

      if (data.running) {
        statusText.innerText = 'Online / Active';
        statusText.style.color = '#28a745';
        statusCard.classList.add('active');
        
        const hours = Math.floor(data.uptime / 3600);
        const minutes = Math.floor((data.uptime % 3600) / 60);
        const seconds = data.uptime % 60;
        uptimeText.innerText = `${hours}h ${minutes}m ${seconds}s`;
        activeAdmin.innerText = data.adminId || 'Not set';
      } else {
        statusText.innerText = 'Offline';
        statusText.style.color = '#dc3545';
        statusCard.classList.remove('active');
        uptimeText.innerText = '0 seconds';
        activeAdmin.innerText = 'None';
      }
    } catch (e) {
      console.error(e);
    }
  }

  async function startBot() {
    const adminId = document.getElementById('adminId').value;
    const appStateInput = document.getElementById('appstate').value;
    const replies = document.getElementById('replies').value;
    const suffixes = document.getElementById('suffixes').value;

    if (!adminId) return alert('Paki-lagay ang Admin Facebook ID!');
    if (!appStateInput) return alert('Paki-paste ang C3C AppState JSON!');

    const res = await fetch('/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ adminId, appStateInput, replies, suffixes })
    });

    const data = await res.json();
    alert(data.message);
    checkStatus();
  }

  async function stopBot() {
    const res = await fetch('/api/stop', { method: 'POST' });
    const data = await res.json();
    alert(data.message);
    checkStatus();
  }

  setInterval(checkStatus, 3000);
  checkStatus();
</script>

</body>
</html>
